[pytest]
markers =
; Список маркировок для тестов для вызова через ключ -m
 regression: mark a regression test,
 smoke: mark a smoke test,
 contracts_list: mark a contracts list test,
 nei: mark a nei test,
 fedresurs: mark a fedresurs test,
 postal: mark a postal test,
 outsource: mark a outsource test,
 contract_page: mark a contract page test,
 test_test: mark test 1 test
 contract_list_page: mark for contract list page tests
 judicial_page: mark for judicial page tests
 outsource_page: mark for outsource page tests
 files_to_ka_page: mark for files to KA page tests
 files_from_ka_page: mark for files from KA page tests
 postall_page: mark for postall page tests
 report_page: mark for report page tests
;  Условие фильтрации для ошибок/уведомления исключая их вывод в терминал
filterwarnings = ignore::DeprecationWarning
console_output_style = classic
disable_test_id_escaping_and_forfeit_functions = True
addopts =
        ; # Папка для "сырых" результатов Allure
        --alluredir=allure-results
        # Очищать папку allure-results перед каждым прогоном [citation:7]
        --clean-alluredir
        ; Выбор браузера для запуска тестов
        ; --browser=firefox
        --browser=chromium
        ; Запуск тестов с отображением браузера
        --headed
        -p no:warnings
        ; Устанавливает уровень логирования в консоль (только ошибки и выше).
        -q --log-cli-level=ERROR 
        ; Не захватывает stdout/stderr от тестов (т.е. print-ы в тестах будут видны, но без pytest-шумов).
        ; --capture=no 
        ; Сокращает traceback (стек ошибок) до минимума.
        ; --tb=short
        ; Используется  для замедления выполнения теста на указанное количество миллисекунд.
        ; --slowmo 1000
        ;  reruns = числу повторений при падении теста
        ; --reruns=1
        ; Чисто n = числу потоков процессора выделенных при выполненни тестов для асинхронного выполнения
        ; -n=4
        ; Распределяет тесты на свободный процесс. Работает по умолчанию
        ;  --dist=load 
        ; Группирует тесты относительно их модулей, классов, функций и распределяет группы на определённый процесс
        ; --dist=loadscope 
        ; Группирует тесты относительно файлов и распределяет файлы на процессы
        ; --dist=loadfile
        ; Группирует тесты по pytest.mark и распределяет на процессы
        ; --dist=loadgroup
        ; Каждый тест запускается на своём процессе, после освобождения процесс переиспользуется
        ; --dist=each
        ; Отключает распределения на процессы и игнорирует ключ -n
        ; --dist=no
        ; Директория для генерации отчёта allure
        ; --alluredir=./allure-results
